[tox]
envlist =
    {py312}-{django521}-{es61}

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
; D101 = Missing docstring in public class
; D200 = One-line docstring should fit on one line with quotes
; D203 = 1 blank line required before class docstring
; D212 = Multi-line docstring summary should start at the first line
ignore = D101,D200,D203,D212
match-dir = (?!migrations)

[testenv]
basepython = py312: python3.12
setenv =
    PYTHONIOENCODING=utf-8
    PYTHONPATH = {toxinidir}

deps =
    django521: Django>=5.2.1,<5.3
    es818: elasticsearch-dsl>=8.18.0,<9.0.0
    -r{toxinidir}/requirements/test.txt

commands =
    ./manage.py migrate --run-syncdb
    coverage run ./manage.py test {posargs}

[testenv:docs]
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
whitelist_externals =
    make
    rm
deps =
    -r{toxinidir}/requirements/doc.txt
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/django_elastic_migrations.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html
    python setup.py check --restructuredtext --strict

[testenv:quality]
setenv =
    PYTHONIOENCODING=utf-8
whitelist_externals =
    make
    touch
deps =
    -r{toxinidir}/requirements/quality.txt
    -r{toxinidir}/requirements/test.txt
commands =
    pylint django_elastic_migrations tests
    pylint --py3k django_elastic_migrations tests
    pycodestyle django_elastic_migrations tests
    pydocstyle django_elastic_migrations tests
    isort --check-only --recursive tests django_elastic_migrations manage.py setup.py test_settings.py
    make selfcheck
